<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Layout — Fiabesco Palace</title>

    <!-- Nạp đúng thứ tự: global.css trước -> layout.css sau -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="/">
          <!-- 🖼️ CHÈN ẢNH #1: Logo đầu bếp (Kích thước CSS: 58×49px) -->
          <img
            class="brand__logo"
            src="../assets/template-20261120T115451Z-1-001 - Copy/template/Logo (remove backround).png"
            alt="Logo Fiabesco Palace"
          />
          <span class="brand__text">
            <span class="brand__name">FiabescoPalace</span>
            <span class="brand__tagline">Italy on Every Plate</span>
          </span>
        </a>

        <!-- Menu điều hướng (Drawer trên Mobile -> Thanh ngang trên Tablet/Desktop) -->
        <nav class="site-nav" id="site-nav" aria-label="Điều hướng chính">
          <div class="site-nav__head">
            <span class="site-nav__label">MENU</span>
            <button
              class="site-nav__close"
              type="button"
              aria-label="Đóng menu"
            >
              ✕
            </button>
          </div>

          <ul class="site-nav__list">
            <li>
              <a class="site-nav__link" href="#" aria-current="page"
                >Trang chủ</a
              >
            </li>
            <li><a class="site-nav__link" href="#">Thực đơn</a></li>
            <li><a class="site-nav__link" href="#">Tra cứu đơn</a></li>
            <li><a class="site-nav__link" href="#">Đặt bàn</a></li>
            <li><a class="site-nav__link" href="#">Về chúng tôi</a></li>
            <li><a class="site-nav__link" href="#">Tuyển dụng</a></li>
            <li><a class="site-nav__link" href="#">Blog</a></li>
            <li><a class="site-nav__link" href="#">Liên hệ</a></li>
            <li><a class="site-nav__link" href="#">Ưu đãi</a></li>
          </ul>

          <!-- Khối liên hệ dưới đáy Drawer Mobile -->
          <div class="site-nav__contact">
            <a class="brand" href="/">
              <!-- 🖼️ CHÈN ẢNH #1 (dùng lại logo trên, CSS tự co 46×39px) -->
              <img
                class="brand__logo"
                src="../assets/template-20261120T115451Z-1-001 - Copy/template/Logo (remove backround).png"
                alt="Logo Fiabesco Palace"
              />
              <span class="brand__text">
                <span class="brand__name">FiabescoPalace</span>
                <span class="brand__tagline">Italy on Every Plate</span>
              </span>
            </a>
            <div>
              <p class="site-nav__hotline-label">HOTLINE</p>
              <a class="site-nav__hotline" href="tel:0123456789"
                >0123 456 789</a
              >
            </div>
            <div class="social-dots">
              <a href="#" aria-label="Facebook">f</a>
              <a href="#" aria-label="Instagram">ig</a>
              <a href="#" aria-label="TikTok">tt</a>
              <a href="#" aria-label="Zalo">z</a>
            </div>
          </div>
        </nav>

        <!-- Cụm icon bên phải Header -->
        <div class="header-actions">
          <a class="header-action" href="#" aria-label="Giỏ hàng">
            <!-- 🖼️ CHÈN ICON #2: Icon giỏ hàng (Kích thước CSS: 30×30px) -->
            <img
              src="../assets/template-20261120T115451Z-1-001 - Copy/template/bộ icon/giohang.svg"
              alt="Giỏ hàng"
            />
            <span class="cart-badge">2</span>
          </a>

          <a class="header-action" href="#" aria-label="Tài khoản">
            <!-- 🖼️ CHÈN ICON #3: Icon tài khoản chưa đăng nhập (Kích thước CSS: 30×30px) -->
            <img
              src="../assets/template-20261120T115451Z-1-001 - Copy/template/bộ icon/thanhvien.svg"
              alt="Tài khoản"
            />
            <!-- Khi đã đăng nhập thì thay thẻ <img> trên bằng: <span class="avatar">PC</span> -->
          </a>

          <button
            class="header-action nav-toggle"
            type="button"
            aria-controls="site-nav"
            aria-expanded="false"
            aria-label="Mở menu"
          >
            <!-- 🖼️ CHÈN ICON #4: Icon 3 gạch menu (Kích thước CSS: 30×22px) -->
            <img
              src="../assets/template-20261120T115451Z-1-001 - Copy/template/bộ icon/thanhmenu.svg"
              alt="Menu"
            />
          </button>
        </div>
      </div>
    </header>

    <main class="container"></main>
  </body>
</html>
